name: yaml_edit
version: 2.2.2-wip
description: >-
  A library for YAML manipulation with comment and whitespace preservation.
repository: https://github.com/dart-lang/yaml_edit

issue_tracker: https://github.com/dart-lang/yaml_edit/issues

topics:
 - yaml

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.0
  shared_preferences: ^2.2.0
  video_player: ^2.8.2
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  record: 
    git:
      url: https://github.com/llfbandit/record.git
      path: record
  audioplayers: ^6.0.0


dev_dependencies:
  coverage: any # we only need format_coverage, don't care what version
  dart_flutter_team_lints: ^3.0.0
  path: ^1.8.0
  test: ^1.17.12
